name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（core + web）
        run: pnpm typecheck

      - name: 单元测试（71 用例）
        run: pnpm test

      - name: 内容校验（387 事件 / 44 支线 / 14 结局）
        run: pnpm validate

      - name: 全量构建
        run: pnpm build
