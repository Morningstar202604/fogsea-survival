<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" rx="20"/>
  <!-- Body -->
  <ellipse cx="200" cy="400" rx="80" ry="120" fill="url(#bodyGrad)" stroke="#f0f0f0" stroke-width="3" filter="url(#shadow)"/>
  <!-- Head -->
  <circle cx="200" cy="220" r="85" fill="#ffe4c4" stroke="#ffdab9" stroke-width="3" filter="url(#shadow)"/>
  <!-- Hair -->
  <path d="M115 220 Q115 120 200 120 Q285 120 285 220" fill="#2f2f2f" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="170" cy="210" rx="18" ry="14" fill="#fff"/>
  <ellipse cx="230" cy="210" rx="18" ry="14" fill="#fff"/>
  <circle cx="170" cy="210" r="10" fill="#2f4f4f"/>
  <circle cx="230" cy="210" r="10" fill="#2f4f4f"/>
  <circle cx="170" cy="210" r="5" fill="#000"/>
  <circle cx="230" cy="210" r="5" fill="#000"/>
  <!-- Eyebrows -->
  <path d="M150 190 Q170 180 190 190" stroke="#1a1a1a" stroke-width="4" fill="none"/>
  <path d="M210 190 Q230 180 250 190" stroke="#1a1a1a" stroke-width="4" fill="none"/>
  <!-- Nose -->
  <path d="M195 230 Q200 240 205 230" stroke="#ffdab9" stroke-width="2" fill="none"/>
  <!-- Mouth -->
  <path d="M180 260 Q200 280 220 260" stroke="#8b4513" stroke-width="3" fill="none"/>
  <!-- Features -->
  <circle cx="170" cy="210" r="20" fill="none" stroke="#333" stroke-width="3"/><circle cx="230" cy="210" r="20" fill="none" stroke="#333" stroke-width="3"/><line x1="190" y1="210" x2="210" y2="210" stroke="#333" stroke-width="3"/><rect x="180" y="370" width="40" height="10" fill="#e53e3e"/><rect x="195" y="355" width="10" height="40" fill="#e53e3e"/>
  <!-- Name plate -->
  <rect x="50" y="520" width="300" height="60" rx="10" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#fff" font-weight="bold">Dr. Lin</text>
</svg>