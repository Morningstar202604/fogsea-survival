<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="#4a148c" rx="20"/>
  <!-- Body -->
  <ellipse cx="200" cy="200" rx="150" ry="120" fill="url(#bodyGrad)" stroke="#7b1fa2" stroke-width="4"/>
  <!-- Eyes -->
  <ellipse cx="150" cy="180" rx="30" ry="25" fill="#e1bee7"/>
  <ellipse cx="250" cy="180" rx="30" ry="25" fill="#e1bee7"/>
  <circle cx="150" cy="180" r="15" fill="#ce93d8"/>
  <circle cx="250" cy="180" r="15" fill="#ce93d8"/>
  <circle cx="150" cy="180" r="8" fill="#000"/>
  <circle cx="250" cy="180" r="8" fill="#000"/>
  <!-- Mouth -->
  <path d="M120 250 Q200 320 280 250" stroke="#4a148c" stroke-width="5" fill="none"/>
  <!-- Teeth -->
  <polygon points="140,250 150,280 160,250" fill="#fff"/>
  <polygon points="180,250 190,290 200,250" fill="#fff"/>
  <polygon points="220,250 230,280 240,250" fill="#fff"/>
  <polygon points="260,250 270,270 280,250" fill="#fff"/>
  <!-- Features -->
  <polygon points="100,200 150,100 200,200" fill="#9c27b0" opacity="0.6"/><polygon points="200,200 250,100 300,200" fill="#9c27b0" opacity="0.6"/><polygon points="150,300 200,200 250,300" fill="#9c27b0" opacity="0.6"/>
  <!-- Name plate -->
  <rect x="50" y="340" width="300" height="50" rx="10" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#fff" font-weight="bold">Crystal Golem</text>
</svg>