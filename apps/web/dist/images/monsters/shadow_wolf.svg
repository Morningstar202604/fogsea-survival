<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a2e" rx="20"/>
  <!-- Body -->
  <ellipse cx="200" cy="200" rx="150" ry="120" fill="url(#bodyGrad)" stroke="#0f0f23" stroke-width="4"/>
  <!-- Eyes -->
  <ellipse cx="150" cy="180" rx="30" ry="25" fill="#ff0000"/>
  <ellipse cx="250" cy="180" rx="30" ry="25" fill="#ff0000"/>
  <circle cx="150" cy="180" r="15" fill="#8b0000"/>
  <circle cx="250" cy="180" r="15" fill="#8b0000"/>
  <circle cx="150" cy="180" r="8" fill="#000"/>
  <circle cx="250" cy="180" r="8" fill="#000"/>
  <!-- Mouth -->
  <path d="M120 250 Q200 320 280 250" stroke="#000" stroke-width="5" fill="none"/>
  <!-- Teeth -->
  <polygon points="140,250 150,280 160,250" fill="#fff"/>
  <polygon points="180,250 190,290 200,250" fill="#fff"/>
  <polygon points="220,250 230,280 240,250" fill="#fff"/>
  <polygon points="260,250 270,270 280,250" fill="#fff"/>
  <!-- Features -->
  <ellipse cx="200" cy="200" rx="100" ry="80" fill="#16213e" opacity="0.5"/><path d="M100 200 Q50 150 100 100" fill="none" stroke="#16213e" stroke-width="10"/><path d="M300 200 Q350 150 300 100" fill="none" stroke="#16213e" stroke-width="10"/>
  <!-- Name plate -->
  <rect x="50" y="340" width="300" height="50" rx="10" fill="rgba(0,0,0,0.7)"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#fff" font-weight="bold">Shadow Wolf</text>
</svg>