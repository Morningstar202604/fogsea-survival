<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="itemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccc00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e" rx="20"/>
  <!-- Item shape -->
  <rect x="40" y="40" width="120" height="120" rx="15" fill="url(#itemGrad)" stroke="#cccc00" stroke-width="3" filter="url(#glow)"/>
  <!-- Item icon -->
  <circle cx="100" cy="90" r="30" fill="#fff" opacity="0.3"/>
  <!-- Item type -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">Scroll</text>
  <!-- Name plate -->
  <rect x="10" y="170" width="180" height="25" rx="5" fill="rgba(0,0,0,0.7)"/>
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">Lightning Scroll</text>
</svg>