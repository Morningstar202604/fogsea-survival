<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#696969;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#696969;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="100" cy="100" rx="30" ry="24.0" fill="url(#bodyGrad)" stroke="#696969" stroke-width="3"/>
  <!-- Eyes -->
  <ellipse cx="85" cy="90" rx="10" ry="8" fill="#ff0000"/>
  <ellipse cx="115" cy="90" rx="10" ry="8" fill="#ff0000"/>
