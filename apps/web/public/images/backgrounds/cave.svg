<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2f2f2f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20"/>
    </filter>
  </defs>
  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <!-- Mountains -->
  <polygon points="0,600 200,400 400,600" fill="#1a1a1a" opacity="0.6"/>
  <polygon points="300,600 500,350 700,600" fill="#1a1a1a" opacity="0.7"/>
  <polygon points="600,600 800,300 1000,600" fill="#1a1a1a" opacity="0.8"/>
  <polygon points="900,600 1100,380 1300,600" fill="#1a1a1a" opacity="0.6"/>
  <polygon points="1200,600 1400,420 1600,600" fill="#1a1a1a" opacity="0.7"/>
  <!-- Ground -->
  <rect y="600" width="1600" height="300" fill="#4a4a4a" opacity="0.8"/>
  <!-- Fog effect -->
  <ellipse cx="400" cy="500" rx="300" ry="100" fill="#fff" opacity="0.2" filter="url(#fog)"/>
  <ellipse cx="1200" cy="550" rx="400" ry="120" fill="#fff" opacity="0.15" filter="url(#fog)"/>
  <!-- Name plate -->
  <rect x="400" y="800" width="800" height="80" rx="20" fill="rgba(0,0,0,0.7)"/>
  <text x="800" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#fff" font-weight="bold">Underground Cave</text>
</svg>